# =============================================================================
#  闲鱼游戏本 · 低价筛选   （2026-10 改版：只做游戏本 + N 卡 + 行情表比价）
# =============================================================================

browser:
  profile_dir: data/browser_profile
  channel: chrome
  headless: true
  headful_fallback: true
  timeout_seconds: 45
  min_delay: 3
  max_delay: 7
  # 留空 = 自动用本机 Chrome 版本拼正常 UA（无头模式必须，否则被判“非法访问”）
  user_agent: ""
  require_login: true

scan:
  pages: 2            # 每个关键词抓几页（一页 30 条）
  min_gap: 100        # ★ 必须比行情表低至少 100 元，才进入打分
  min_score: 55       # 低于这个分数不进报表
  max_age_hours: 0    # >0 时只看最近 N 小时发布的
  top_n_markdown: 20
  detail_limit: 20    # 只给初筛候选抓详情描述，最多 N 条；0 = 关闭详情细筛

# -----------------------------------------------------------------------------
#  行情表：直接读你自己的《笔电行情.xlsx》导出结果
#  首次/更新后运行：python -m xianyu import-prices "笔电行情.xlsx"
#  行情表含个人收机价，已在 .gitignore 中排除，不会上传仓库
# -----------------------------------------------------------------------------
price_table:
  path: data/price_table.json
  source_xlsx: "笔电行情.xlsx"

# -----------------------------------------------------------------------------
#  品类闸门：只留游戏本
#  必须能识别出英伟达显卡（GTX/RTX + 型号），否则直接排除
# -----------------------------------------------------------------------------
category:
  # 软排除：标题写了“游戏本”时豁免；工作站/台式/求购/配件由代码里的硬排除负责
  exclude:
    - 轻薄
    - 超极本
    - 商务本
    - 办公本
    - 学生本
    - 二合一
    - 平板
    - 上网本
    - 全能本
    - 创作本
    - 设计本

filters:
  # 标题命中这些词直接丢（否定句如“无拆机”不算）
  exclude:
    - 求购
    - 收一台
    - 高价回收
    - 租赁
    - 出租
    - 拆机
    - 模型
    - 代拍
    - 只换不出
  seller_exclude: [店铺, 实体店, 批发, 回收, 工作室, 数码城, 专营店, 数码]
  min_price: 500
  max_price: 8000
  location_allow: []

# 标题信号词
signals:
  good: [全新, 未拆封, 未激活, 在保, 国行, 带票, 箱说全, 自用, 一手, 无磕碰, 无划痕, 无维修, 无拆修, 无暗病, 电池健康]
  bad: [磕碰, 划痕, 掉漆, 瑕疵, 进水, 维修过, 换过, 暗病, 电池鼓包, 拆过, 无硬盘, 无内存, 无电源, 屏幕老化, 漏光]
  merchant: [店铺, 实体店, 批发, 回收, 工作室, 数码城, 专营店, 大量到货]
  bait: [定金, 订金, 押金, 首付, 租金, 月付, 分期, 私下交易, 加微信, 加v, vx, 微信, 扣扣, 详细咨询]
  broken: [配件, 维修, 碎屏, 换屏, 主板, 拆机, 屏幕总成, 无屏, 黑屏, 开不了机, 不开机, 进水, 点不亮, 花屏, 漏液, 压坏, 坏机, 要修, 会修的来, 当配件, 账号锁, 有锁, ID锁, 激活锁, 监管机, 配置锁]
  # 硬排除：空机/缺内存硬盘，按商家处理（命中直接丢，不再打分）
  merchant_reject: [空机, 无内存, 没内存, 没有内存, 不含内存, 缺内存, 无硬盘, 没硬盘, 没有硬盘, 不含硬盘, 缺硬盘, 无固态, 没有固态, 不含固态, 内存硬盘都没有, 内存硬盘全无, 内存硬盘均无]
  # 硬排除：开机故障（黑屏/花屏仍只做扣分和异常标记）
  boot_reject: [无法开机, 开不了机, 不能开机, 不开机, 点不亮]

# 打分权重（一般不用改）
scoring:
  base: 20
  price_max: 40
  wants_penalty_low: -4          # 想要 50+
  wants_penalty_high: -8         # 想要 100+

# -----------------------------------------------------------------------------
#  搜索词：按显卡档位搜，省事且命中率高
# -----------------------------------------------------------------------------
watches:
  - name: 游戏本 3060
    keyword: 游戏本 3060
    pages: 2
  - name: 游戏本 4060
    keyword: 游戏本 4060
    pages: 2
  - name: 游戏本 2060
    keyword: 游戏本 2060
    pages: 1
  - name: 游戏本 1660ti
    keyword: 游戏本 1660ti
    pages: 1
  - name: 游戏本 1060
    keyword: 游戏本 1060
    pages: 1
  - name: 拯救者 R9000P
    keyword: 拯救者 R9000P
    pages: 1

# 推送（可选）
notify:
  wecom_webhook: ""
  bark_url: ""
  min_score: 75
