# =============================================================================
#  闲鱼游戏本 · 方案二：登录 + 只搜搜索页 + 手动 loop + 低频
#  扫码登录（login.bat，只需一次）→ 每轮只抓搜索页 → 粗筛（搜索页商家判断）
#  → 直接出报表。不打开任何卖家主页：跨商品商家识别转人工审核。
# =============================================================================

browser:
  # 登录态保存在这个长期复用的 profile 里（cookie 就在其中），
  # data/login_state.json 只是登录标记（用户 ID + 时间），供自检用
  profile_dir: data/browser_profile
  channel: chrome            # 用本机 Chrome；改成 null 则用 Playwright Chromium
  headless: false            # 有头运行：看得见页面，风控时能立刻停
  timeout_seconds: 45
  min_delay: 8               # 搜索关键词之间的随机间隔（秒）——低频
  max_delay: 15
  # 留空 = 自动用本机 Chrome 版本拼正常 UA
  user_agent: ""
  require_login: true        # true = 搜索前必须已登录（login.bat 扫码）
  # 有头模式遇到 Baxia 滑块时，停下来等主人手动处理的秒数；超时才判风控
  baxia_wait_seconds: 120
  # 反检测加固：注入 5 条 bypass 脚本（webdriver/Playwright 痕迹/chrome 对象/插件/通知权限）
  # 并清理 --enable-automation 等启动参数。借鉴自 Scrapling（BSD-3-Clause）。
  # 上游 screen_props.js 实测有害（会覆盖真实窗口尺寸），未采用。
  # 登录态下被识别成自动化的后果是账号级，这项加固对方案二尤其值得保留
  stealth: true

scan:
  pages: 2              # 每轮每个关键词搜索页数（一页 30 条）
  max_age_hours: 24     # 客户端发布时间窗（小时）：点「最新」拿真时间序后，超过 24 小时的商品在粗筛前滤掉；0 = 不筛
  top_n_markdown: 50
  # 进搜索页后点「新发布 → 最新」。
  # 搜索地址里的 sortType=time 已实测被服务端忽略，不再使用。
  # 2026-10-22 真实 A/B：「1天内」只加时间窗、返回不是新→旧；「最新」才是真时间序
  # （两者是同组互斥子项，只能二选一，时间窗交给上面的 max_age_hours）。
  # 点筛选会多触发 1 次搜索请求（每个关键词第 1 页一次）。
  newest_first: true
  # 老货提前停：某一页整页商品都已经在库里出现过，且这一页确实是新→旧，就不再往下翻页
  # 排序没落地（返回不是新→旧）时会自动退回正常翻页，不会漏新货
  stop_on_known: true
  # 卖家画像（评价数/好评率/严选身份，搜索接口零额外请求带回）：
  # 评价数达到该值就在审核页和报表标注「疑似职业卖家」——只标注、不排除；0 = 关闭标注
  seller_review_hint: 100
  # ↓ 以下三项只在 pricing.enabled=true 时生效
  min_gap: 100
  min_score: 55
  # 风控熔断：各档独立计数、独立冷却（详见 xianyu/guard.py 头部说明）
  failure_threshold: 3          # 人机验证/处罚类：需要人工处理，按天冷却
  fine_failure_threshold: 3     # 兼容保留：细筛已移除，恒不触发
  soft_failure_threshold: 3     # 软失败（超时、结构异常、可能改版）阈值
  cooldown_minutes: 1440
  cooldown_max_minutes: 10080
  soft_cooldown_minutes: 60
  soft_cooldown_max_minutes: 1440
  # 频率限制（「请求频率或额度已超限」、ret 里的 TRAFFIC/RATE_LIMIT）：
  # 闲鱼自己会解除，不需要人工过验证，单独走一条短梯子
  rate_limit_threshold: 1
  rate_limit_cooldown_minutes: 30
  rate_limit_max_minutes: 720   # 连续命中最多冷却 12 小时
  # 每日请求预算：按实际发出的搜索接口请求计数，落盘到 data/request_budget.json，
  # scan 与 loop 共用、跨进程累计；超过就停止（0 = 不限制）
  daily_request_budget: 200

# -----------------------------------------------------------------------------
#  卖家主页细筛：方案二整体关闭。
#  代码保留仅为兼容旧配置；这里开着也不会打开卖家主页（引擎已移除该阶段）。
#  跨商品商家识别（主页挂一串电脑/大疆卖家）转人工：审核时点开链接看卖家在售。
# -----------------------------------------------------------------------------
fine:
  enabled: false

# -----------------------------------------------------------------------------
#  loop 控制台行为
# -----------------------------------------------------------------------------
loop:
  reuse_browser: true    # 跨轮复用同一个浏览器，不每轮重启
  # 纯手动：每轮结束必须输入 next 才继续，没有任何自动续跑。
  # 相邻两轮至少间隔 300 秒；提前输入 next 只会提示，再输一次才放行。
  min_round_gap_seconds: 300

# -----------------------------------------------------------------------------
#  粗筛用的词表（搜索页商家判断，全部保留）
# -----------------------------------------------------------------------------
filters:
  # 仅 pricing.enabled=true 时参与旧的比价流程
  exclude:
    - 求购
    - 收一台
    - 高价回收
    - 租赁
    - 出租
    - 拆机
    - 模型
    - 代拍
    - 只换不出
  # 卖家昵称命中即排除（v3.8.4 新增：经销部/电脑/严选/电子/包换/二手/科技/小铺）
  seller_exclude: [店铺, 实体店, 批发, 回收, 工作室, 数码城, 专营店, 数码, 小店, 精选, 小卖部, 购物, 优品, 笔记本, 经销部, 电脑, 严选, 电子, 包换, 二手, 科技, 小铺]
  min_price: 0
  max_price: 999999
  location_allow: []

signals:
  good: [全新, 未拆封, 未激活, 在保, 国行, 带票, 箱说全, 自用, 一手, 无磕碰, 无划痕, 无维修, 无拆修, 无暗病, 电池健康]
  bad: [磕碰, 划痕, 掉漆, 瑕疵, 进水, 维修过, 换过, 暗病, 电池鼓包, 拆过, 无硬盘, 无内存, 无电源, 屏幕老化, 漏光]
  # 商家筛选模块 1：标题/商品介绍/卖家昵称命中即排除
  merchant: [店铺, 实体店, 批发, 回收, 工作室, 数码城, 专营店, 大量到货]
  bait: [定金, 订金, 押金, 首付, 租金, 月付, 分期, 私下交易, 加微信, 加v, vx, 微信, 扣扣, 详细咨询]
  broken: [配件, 维修, 碎屏, 换屏, 主板, 拆机, 屏幕总成, 无屏, 黑屏, 开不了机, 不开机, 进水, 点不亮, 花屏, 漏液, 压坏, 坏机, 要修, 会修的来, 当配件, 账号锁, 有锁, ID锁, 激活锁, 监管机, 配置锁]
  # 空机/缺内存硬盘，直接排除
  merchant_reject: [空机, 无内存, 没内存, 没有内存, 不含内存, 缺内存, 无硬盘, 没硬盘, 没有硬盘, 不含硬盘, 缺硬盘, 无固态, 没有固态, 不含固态, 内存硬盘都没有, 内存硬盘全无, 内存硬盘均无]
  # 开机故障，直接排除
  boot_reject: [无法开机, 开不了机, 不能开机, 不开机, 点不亮]
  # 问题机/故障描述（v3.8.4 新增）：标题或介绍命中即排除，进不符合
  problem_reject: [问题机, 进不去系统, win转圈卡死, 处理配件]

# -----------------------------------------------------------------------------
#  价格筛选/行情表/打分：默认关闭，代码保留
#  改成 true 后，粗筛通过的条目会再走旧的行情表比价和打分
#  （N 卡门槛已经在粗筛里，不依赖这个开关）
# -----------------------------------------------------------------------------
pricing:
  enabled: false

price_table:
  path: data/price_table.json
  source_xlsx: "笔电行情.xlsx"

# 本地审核页端口：review.bat 与报表「忽略」键共用。
# 如果 8765 被占用，改这里（不要只加 --port，否则报表按钮会指错端口）。
review:
  port: 8765

category:
  # 仅 pricing.enabled=true 时生效
  exclude:
    - 轻薄
    - 超极本
    - 商务本
    - 办公本
    - 学生本
    - 二合一
    - 平板
    - 上网本
    - 全能本
    - 创作本
    - 设计本

scoring:
  # 仅 pricing.enabled=true 时生效
  base: 20
  price_max: 40
  wants_penalty_low: -4
  wants_penalty_high: -8

# -----------------------------------------------------------------------------
#  关键词：2026-10-23 主人要求收缩到 1 个，只留「游戏本」——减少请求量，
#  「游戏本电脑」与它高度重叠、「RTX3060笔记本」产出有限，都不再搜。
#  想加回来直接照格式加一段（每个关键词每轮约 3 个请求：首屏、点「最新」、第 2 页）。
# -----------------------------------------------------------------------------
watches:
  - name: 游戏本
    keyword: 游戏本
    pages: 2

notify:
  wecom_webhook: ""
  bark_url: ""
  min_score: 0
