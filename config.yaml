# =============================================================================
#  闲鱼游戏本 · 低价筛选   （2026-10 改版：只做游戏本 + N 卡 + 行情表比价）
# =============================================================================

browser:
  profile_dir: data/browser_profile
  channel: chrome
  headless: true
  headful_fallback: true
  timeout_seconds: 45
  min_delay: 3
  max_delay: 7
  # 留空 = 自动用本机 Chrome 版本拼正常 UA（无头模式必须，否则被判“非法访问”）
  user_agent: ""
  require_login: true

scan:
  pages: 2            # 每个关键词抓几页（一页 30 条）
  min_gap: 100        # ★ 必须比行情表低至少 100 元，才进入打分
  min_score: 55       # 低于这个分数不进报表
  max_age_hours: 0    # >0 时只看最近 N 小时发布的
  top_n_markdown: 20

# -----------------------------------------------------------------------------
#  行情表：直接读你自己的《笔电行情.xlsx》导出结果
#  首次/更新后运行：python -m xianyu import-prices "E:\useful\文件\笔电行情.xlsx"
# -----------------------------------------------------------------------------
price_table:
  path: data/price_table.json
  source_xlsx: "E:\\useful\\文件\\笔电行情.xlsx"

# -----------------------------------------------------------------------------
#  品类闸门：只留游戏本
#  必须能识别出英伟达显卡（GTX/RTX + 型号），否则直接排除
# -----------------------------------------------------------------------------
category:
  exclude:
    - 轻薄
    - 超极本
    - 商务本
    - 办公本
    - 学生本
    - 二合一
    - 平板
    - 上网本
    - 全能本
    - 创作本
    - 设计本
    - 移动工作站
    - 工作站
    - 台式机
    - 台式
    - 迷你主机
    - 一体机
    - 显示器
    - 求购
    - 租赁
    - 出租
    - 配件
    - 拆机
    - 保护壳
    - 键盘膜
    - 贴纸
    - 屏幕总成

filters:
  # 标题命中这些词直接丢（和 category.exclude 合并生效）
  exclude:
    - 求购
    - 收一台
    - 高价回收
    - 租赁
    - 出租
    - 拆机
    - 配件
    - 保护壳
    - 键盘膜
    - 贴纸
    - 屏幕总成
    - 电源适配器
    - 模型
    - 代拍
    - 只换不出
  seller_exclude: [店铺, 实体店, 批发, 回收, 工作室, 数码城, 专营店]
  min_price: 500
  max_price: 8000
  location_allow: []

# 标题信号词
signals:
  good: [全新, 未拆封, 未激活, 在保, 国行, 带票, 箱说全, 自用, 一手, 无磕碰, 无划痕, 无维修, 无拆修, 无暗病, 电池健康]
  bad: [磕碰, 划痕, 掉漆, 瑕疵, 进水, 维修过, 换过, 暗病, 电池鼓包, 拆过, 无硬盘, 无内存, 无电源, 屏幕老化, 漏光]
  merchant: [店铺, 实体店, 批发, 回收, 工作室, 数码城, 专营店, 大量到货]
  bait: [定金, 订金, 押金, 首付, 租金, 月付, 分期, 私下交易, 加微信, 加v, vx, 微信, 扣扣, 详细咨询]
  broken: [配件, 维修, 碎屏, 换屏, 主板, 拆机, 屏幕总成, 无屏, 黑屏, 开不了机, 不开机, 进水, 点不亮, 花屏, 漏液, 压坏, 坏机, 要修, 会修的来, 当配件, 账号锁, 有锁, ID锁, 激活锁, 监管机, 配置锁]

# 打分权重（一般不用改）
scoring:
  base: 20
  price_max: 40
  merchant_penalty: -18          # 标题/昵称就看得出是商家
  audited_merchant_penalty: -10  # 卖家主页确认是商家，再扣一次
  wants_penalty_low: -4          # 想要 50+
  wants_penalty_high: -8         # 想要 100+

# -----------------------------------------------------------------------------
#  卖家审核：看主页在卖什么
#  大疆/无人机 → 直接排除；苹果设备多 → 减分；回收/实体店 → 商家减分
# -----------------------------------------------------------------------------
audit:
  enabled: true
  max_items: 8       # 每次最多查几个卖家（每个约 8~10 秒，越大越慢）
  min_score: 50
  scroll_times: 3    # 卖家主页往下滚几次，加载更多在售商品

# -----------------------------------------------------------------------------
#  搜索词：按显卡档位搜，省事且命中率高
# -----------------------------------------------------------------------------
watches:
  - name: 游戏本 3060
    keyword: 游戏本 3060
    pages: 2
  - name: 游戏本 4060
    keyword: 游戏本 4060
    pages: 2
  - name: 游戏本 2060
    keyword: 游戏本 2060
    pages: 1
  - name: 游戏本 1660ti
    keyword: 游戏本 1660ti
    pages: 1
  - name: 游戏本 1060
    keyword: 游戏本 1060
    pages: 1
  - name: 拯救者 R9000P
    keyword: 拯救者 R9000P
    pages: 1

# 推送（可选）
notify:
  wecom_webhook: ""
  bark_url: ""
  min_score: 75
